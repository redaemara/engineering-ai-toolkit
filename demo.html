<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering AI Toolkit</title><style>:root{font:16px/1.5 system-ui,sans-serif;color:#192b3c;background:#edf2f5}*{box-sizing:border-box}body{margin:0}header{background:#102d43;color:white;padding:2.5rem max(5vw,1rem)}h1{font-size:clamp(2rem,5vw,3.5rem);margin:.4rem 0}.tag{letter-spacing:.15em;color:#8fdbd1;font-size:.75rem}main{max-width:1100px;margin:auto;padding:1.2rem}nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}button{border:0;background:#126a69;color:white;padding:.65rem 1rem;border-radius:.45rem;font:inherit;cursor:pointer}nav button{background:#d9e7ed;color:#203d52}nav button[aria-current=true]{background:#126a69;color:white}section{background:white;border-radius:12px;padding:clamp(1rem,4vw,2rem);box-shadow:0 4px 22px #193c5610}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:1rem;align-items:end}label{display:flex;flex-direction:column;gap:.3rem;font-weight:600}input,select,textarea{font:inherit;border:1px solid #a7b9c6;border-radius:.4rem;padding:.6rem;width:100%;min-width:0}textarea{min-height:100px}.wide{grid-column:1/-1}#error{color:#a21b35}#result{overflow:auto}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{padding:.6rem;text-align:left;border-bottom:1px solid #dde6ec}th{background:#eaf3f5}.track{display:flex;background:#d6dee2;height:32px;overflow:hidden;border-radius:4px;min-width:250px}.piece{background:#12827f;color:white;border-right:2px solid white;display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden}.loss{background:#e6a24a}.remnant{background:#d6dee2}footer{font-size:.85rem;margin:1.5rem 0;color:#526474}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #e89c30;outline-offset:2px}
</style></head>
<body><header><span class="tag">ENGINEERING / OPEN TOOLKIT</span><h1>Engineering AI Toolkit</h1><p>Transparent engineering arithmetic • v0.1.0 review candidate</p></header><main><nav aria-label="Modules" id="nav"></nav><section id="workspace"><h2 id="title"></h2><form id="form"></form><p id="error" role="alert"></p><div id="result" aria-live="polite"></div></section><footer>Independent educational and estimation tools. Verify assumptions and obtain professional engineering review before construction or fabrication. License and public release pending.</footer></main><script>(function(root,factory){const api=factory();if(typeof module==='object')module.exports=api;else root.Engineering=api;})(globalThis,()=>{
'use strict';
const num=(x,name='value',zero=false)=>{if(typeof x!=='number'||!Number.isFinite(x)||(zero?x<0:x<=0))throw Error(name+' must be '+(zero?'nonnegative':'positive')+' and finite');return x};
const qty=x=>{num(x,'quantity');if(!Number.isSafeInteger(x))throw Error('Quantity must be an integer');return x};
const units={length:{mm:.001,cm:.01,m:1,km:1000,in:.0254,ft:.3048,yd:.9144},area:{mm2:1e-6,cm2:1e-4,m2:1,ft2:.09290304,in2:.00064516,yd2:.83612736},volume:{mm3:1e-9,cm3:1e-6,m3:1,L:.001,ft3:.028316846592,in3:.000016387064,yd3:.764554857984},mass:{g:.001,kg:1,t:1000,lb:.45359237,oz:.028349523125}};
function convert(value,dimension,from,to){num(value,'value',true);const u=Object.hasOwn(units,dimension)&&units[dimension];if(!u||!Object.hasOwn(u,from)||!Object.hasOwn(u,to))throw Error('Incompatible units');return num(value*u[from]/u[to],'result',true)}
function section(shape,{b,h,d,t,a}){
 let area,ix,iy;
 if(shape==='rectangle'||shape==='plate'){num(b,'width');num(h,'height');area=b*h;ix=b*h**3/12;iy=h*b**3/12;}
 else if(shape==='rhs'){num(b,'width');num(h,'height');num(t,'thickness');if(2*t>=Math.min(b,h))throw Error('Wall too thick');area=b*h-(b-2*t)*(h-2*t);ix=(b*h**3-(b-2*t)*(h-2*t)**3)/12;iy=(h*b**3-(h-2*t)*(b-2*t)**3)/12;}
 else if(shape==='round'||shape==='chs'){num(d,'diameter');let inner=0;if(shape==='chs'){num(t,'thickness');if(2*t>=d)throw Error('Wall too thick');inner=d-2*t;}area=Math.PI*(d*d-inner*inner)/4;ix=iy=Math.PI*(d**4-inner**4)/64;}
 else if(shape==='custom'){area=num(a,'area');ix=iy=null;}else throw Error('Unknown section');
 return {area:num(area,'area'),ix:ix===null?null:num(ix,'Ix'),iy:iy===null?null:num(iy,'Iy')};
}
function weight(shape,dimensions,density,length,count=1){num(density,'density');num(length,'length');qty(count);const s=section(shape,dimensions);const kgPerM=s.area*1e-6*density;return {...s,kgPerM,totalKg:num(kgPerM*length*count,'mass')}}
function takeoff(type,length,width,height,count=1,rate=0){num(length,'length');qty(count);num(rate,'rate',true);let per=length;if(type==='area'||type==='volume')per*=num(width,'width');if(type==='volume')per*=num(height,'height');if(!['linear','area','volume'].includes(type))throw Error('Unknown quantity type');const total=num(per*count,'total');return {type,unit:{linear:'m',area:'m²',volume:'m³'}[type],perElement:per,count,total,rate,cost:num(total*rate,'cost',true)}}
function consumption(net,wastePercent,rate=0){num(net,'net',true);num(wastePercent,'waste',true);num(rate,'rate',true);const allowance=net*wastePercent/100;return {net,allowance,gross:num(net+allowance,'gross',true),cost:num((net+allowance)*rate,'cost',true)}}
function cutting(stock,kerf,trim,rows){
 // Integer millimetres; trim is material reserved at EACH end, inclusive of its trim cut.
 [stock,kerf,trim].forEach((v,i)=>{num(v,['stock','kerf','trim'][i],i>0);if(!Number.isSafeInteger(v)||v>10000000)throw Error('Use integer mm up to 10,000,000')});
 if(!Array.isArray(rows)||!rows.length)throw Error('Enter cutting list');
 const cap=stock-2*trim;if(cap<=0)throw Error('Trim consumes stock');
 let pieces=[];
 for(const row of rows){const l=num(row.length,'cut length');const n=qty(row.quantity);if(!Number.isSafeInteger(l)||l+kerf>cap)throw Error('Cut plus kerf exceeds usable stock or is not integer mm');if(pieces.length+n>5000)throw Error('Maximum 5000 pieces');for(let i=0;i<n;i++)pieces.push(l);}
 pieces.sort((a,b)=>b-a);
 // Conservative policy: one kerf per finished piece.
 let bins=[];
 for(const p of pieces){let best=-1,left=Infinity;for(let i=0;i<bins.length;i++){const r=cap-bins[i].used-p-kerf;if(r>=0&&r<left){best=i;left=r}}if(best<0)bins.push({used:p+kerf,cuts:[p]});else{bins[best].used+=p+kerf;bins[best].cuts.push(p)}}
 const lowerBound=Math.ceil(pieces.reduce((s,p)=>s+p+kerf,0)/cap);
 const bars=bins.map((b,i)=>({bar:i+1,cuts:b.cuts,product:b.cuts.reduce((s,p)=>s+p,0),kerf:b.cuts.length*kerf,trim:2*trim,remnant:cap-b.used}));
 const product=bars.reduce((s,b)=>s+b.product,0), purchased=stock*bars.length, sawLoss=bars.reduce((s,b)=>s+b.kerf+b.trim,0),remnant=bars.reduce((s,b)=>s+b.remnant,0);
 return {stock,bars,lowerBound,optimal:bars.length===lowerBound,method:'Best-fit decreasing; optimum certified only if capacity lower bound reached',product,purchased,sawLoss,remnant,unused:purchased-product,utilization:100*product/purchased};
}
function csv(headers,rows){const cell=v=>{let s=String(v??'');if(typeof v==='string'&&/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};return [headers,...rows].map(r=>r.map(cell).join(',')).join('\r\n')+'\r\n'}
return {units,convert,section,weight,takeoff,consumption,cutting,csv};
});
</script><script>'use strict';
const E=Engineering,$=id=>document.getElementById(id),form=$('form'),result=$('result');
const el=(tag,txt,parent)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(parent)parent.append(e);return e};
const field=(name,label,value,options)=>{let l=el('label',label,form),e=el(options?'select':'input',undefined,l);e.name=name;if(options){for(const v of options){const o=el('option',v,e);o.value=v}e.value=value}else{e.type='number';e.step='any';e.required=true;e.value=value}return e};
const area=(name,label,value)=>{let l=el('label',label,form);l.className='wide';let e=el('textarea',value,l);e.name=name;e.required=true;return e};
const fmt=x=>typeof x==='number'?Number(x.toPrecision(10)).toLocaleString('en-US',{maximumFractionDigits:8}):String(x??'—');
function table(head,rows){let t=el('table',undefined,result),tr=el('tr',undefined,el('thead',undefined,t));head.forEach(x=>el('th',x,tr));let body=el('tbody',undefined,t);for(const row of rows){tr=el('tr',undefined,body);row.forEach(x=>el('td',fmt(x),tr))}}
function summary(object){table(['Parameter','Value'],Object.entries(object))}
function exportCSV(head,rows){let b=el('button','Download CSV',result);b.onclick=()=>{const u=URL.createObjectURL(new Blob([E.csv(head,rows)],{type:'text/csv'}));const a=el('a');a.href=u;a.download='engineering-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
let run;
const n=k=>{const raw=form.elements[k].value;if(!raw.trim())throw Error(k+' is required');return Number(raw)},s=k=>form.elements[k].value;
function shapeFields(){field('shape','Section','rhs',['rhs','chs','rectangle','round','plate','custom']);field('b','Width (mm)',100);field('h','Height (mm)',50);field('t','Wall (mm)',2);field('d','Diameter (mm)',50);field('a','Custom area (mm²)',500)}
const dims=()=>({b:n('b'),h:n('h'),t:n('t'),d:n('d'),a:n('a')});
const modules=[
 ['Unit converter',()=>{field('value','Value',12);const dimension=field('dimension','Dimension','length',Object.keys(E.units));const from=field('from','From','in',Object.keys(E.units.length)),to=field('to','To','ft',Object.keys(E.units.length));dimension.onchange=()=>{for(const e of [from,to]){e.replaceChildren();for(const u of Object.keys(E.units[dimension.value]))el('option',u,e)}};run=()=>summary({result:E.convert(n('value'),s('dimension'),s('from'),s('to')),unit:s('to')})}],
 ['Material weight',()=>{shapeFields();field('density','Density (kg/m³)',7850);field('length','Length (m)',6);field('count','Count',1);run=()=>{let r=E.weight(s('shape'),dims(),n('density'),n('length'),n('count'));summary({'Area (mm²)':r.area,'Mass per metre (kg/m)':r.kgPerM,'Total mass (kg)':r.totalKg})}}],
 ['Cutting stock',()=>{field('stock','Stock (mm)',6000);field('kerf','Kerf per piece (mm)',5);field('trim','Trim per end (mm)',10);area('rows','Cut length mm, quantity (one pair per line)','2000,2\n1950,1');run=()=>{let rows=s('rows').trim().split(/\r?\n/).map(line=>{let a=line.split(',');if(a.length!==2||a.some(x=>!x.trim()))throw Error('Each line must contain length, quantity');return {length:Number(a[0]),quantity:Number(a[1])}});let r=E.cutting(n('stock'),n('kerf'),n('trim'),rows);summary({'Bars':r.bars.length,'Lower bound':r.lowerBound,'Optimality':r.optimal?'Certified minimum bar count':'Approximate solution','Product (mm)':r.product,'Purchased (mm)':r.purchased,'Saw + trim loss (mm)':r.sawLoss,'Remnant (mm)':r.remnant,'Utilization (%)':r.utilization,'Policy':'One kerf per piece; trim per end'});const heads=['Bar','Cuts (mm)','Product','Kerf','Trim','Remnant'],data=r.bars.map(b=>[b.bar,b.cuts.join(' + '),b.product,b.kerf,b.trim,b.remnant]);table(heads,data);for(const b of r.bars.slice(0,100)){el('p','Bar '+b.bar,result);let track=el('div',undefined,result);track.className='track';for(const [length,kind,label] of [[b.trim/2,'loss',''],...b.cuts.flatMap(p=>[[p,'piece',p],[n('kerf'),'loss','']]),[b.trim/2,'loss',''],[b.remnant,'remnant','']]){const x=el('span',label,track);x.className=kind;x.style.width=100*length/r.stock+'%';x.title=length+' mm'}}if(r.bars.length>100)el('p','First 100 layouts shown; table and CSV contain all bars.',result);exportCSV(heads,data)}}],
 ['Quantity takeoff',()=>{area('rows','Item, type (linear/area/volume), L, W, H, count, rate','Wall,area,5,3,0,2,10\nSlab,volume,4,3,0.2,1,120');run=()=>{const rows=s('rows').trim().split(/\r?\n/).map(line=>{let a=line.split(',');if(a.length!==7||a.some(x=>!x.trim()))throw Error('Expected seven comma-separated values');const [name,type,...v]=a;let r=E.takeoff(type.trim(),...v.map(Number));return [name,r.unit,r.perElement,r.count,r.total,r.rate,r.cost]});let h=['Item','Unit','Per element','Count','Quantity','Rate','Cost'];table(h,rows);summary({'Total cost':rows.reduce((a,b)=>a+b[6],0)});exportCSV(h,rows)}}],
 ['Section properties',()=>{shapeFields();run=()=>{const r=E.section(s('shape'),dims());summary({'Area (mm²)':r.area,'Ix (mm⁴)':r.ix,'Iy (mm⁴)':r.iy})}}],
 ['Consumption & cost',()=>{field('net','Net demand',100);field('waste','Allowance on net (%)',5);field('rate','Unit rate',2);run=()=>summary(E.consumption(n('net'),n('waste'),n('rate')))}]
];
function select(i){form.replaceChildren();result.replaceChildren();$('error').textContent='';$('title').textContent=modules[i][0];Array.from($('nav').children).forEach((b,j)=>b.setAttribute('aria-current',String(i===j)));modules[i][1]();const b=el('button','Calculate',form);b.type='submit'}
modules.forEach(([name],i)=>{let b=el('button',name,$('nav'));b.onclick=()=>select(i)});
form.onsubmit=e=>{e.preventDefault();result.replaceChildren();$('error').textContent='';try{run()}catch(err){result.replaceChildren();$('error').textContent=err.message}};
select(0);
</script></body></html>
